version: "3.9"
services:
  api:
    build: .
    container_name: venture_api
    ports:
      - "8000:8000"
    env_file:
      - .env.example
    depends_on:
      - db
  db:
    image: postgres:16-alpine
    container_name: venture_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-venturescope}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
volumes:
  pgdata:
